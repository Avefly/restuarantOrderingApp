<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <!--Font Awesome CDN-->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
       integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
       crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <body>
        <header>
            <img class="header-image" src="images/header.png">
        </header>
        <main>
            <section id="menu-section">
            </section>
            <section id="order-section" class="hidden">
                <div class="order-container">
                    <p class="big-text center-text">Your Order</p>
                    <div class="order-details">
                    </div>
                    <div class ='price-info'>
                    </div>
                    <button class="order-button">Complete Order</button>
                </div>
            </section>
            <section class="card-section hidden">
                <p class="big-text">Enter Card Details</p>
                <form class="card-form">
                    <input
                    id="input-name"
                    type="text"
                    name="name"
                    placeholder="Enter your name" 
                    minlength="5" 
                    required>
                    <input
                    type="text"
                    name="cardNumber"
                    placeholder="Enter card Number"
                    inputmode="numeric"
                    minlength="10"
                    required>
                    <input
                    type="text"
                    name="cvvNumber"
                    inputmode="numeric"
                    placeholder="Enter your CVV" 
                    minlength="3"
                    required>
                    <button class="pay-btn order-button">Pay</button>
                </form>
            </section>
            <section class="end-section hidden" >
            </section>
        </main>
	<script src="index.js" type="module"></script>
    </body>
</html>
